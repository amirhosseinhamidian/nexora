name: Alert inbox acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  alert-inbox-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify P3-07 prerequisite
        run: python3 scripts/verify_human_decision_review.py
      - name: Verify P3-08 alert inbox contract
        run: python3 scripts/verify_alert_inbox.py
      - name: Run repository contract tests
        run: python3 -m unittest discover -s tests -v

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen --python 3.13
      - name: Check backend format
        run: >-
          uv run ruff format --check apps/server alembic
          scripts/verify_alert_inbox.py
          tests/test_alert_inbox_contract.py
      - name: Lint backend
        run: >-
          uv run ruff check apps/server alembic
          scripts/verify_alert_inbox.py
          tests/test_alert_inbox_contract.py
      - name: Typecheck backend
        run: uv run mypy
      - name: Run backend tests
        run: uv run pytest -m "not integration" -q
      - name: Verify runtime contract drift
        run: uv run python scripts/generate_runtime_contracts.py --check

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.8"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Install locked Web dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Web format
        run: pnpm format:check
      - name: Lint Web
        run: pnpm lint
      - name: Typecheck Web
        run: pnpm typecheck
      - name: Test Web
        run: pnpm test
      - name: Build Web
        run: pnpm build

  postgresql-17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: nexora_test
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_ci_fixture_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NEXORA_MIGRATION_DATABASE_DSN_FILE: /tmp/nexora-database.dsn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen --python 3.13
      - name: Create private CI fixture DSN file
        run: |
          umask 077
          printf '%s\n' 'postgresql+psycopg://nexora:nexora_ci_fixture_password@127.0.0.1:5432/nexora_test' > "$NEXORA_MIGRATION_DATABASE_DSN_FILE"
      - name: Verify upgrade path and alert persistence
        run: |
          uv run alembic upgrade 20261116_0012
          uv run alembic upgrade head
          uv run pytest apps/server/tests/test_postgresql_integration.py -m integration -k "alert_inbox or current_migration_head" -q
      - name: Verify fresh-install migration
        env:
          PGPASSWORD: nexora_ci_fixture_password
        run: |
          createdb --host 127.0.0.1 --username nexora nexora_fresh
          umask 077
          printf '%s\n' 'postgresql+psycopg://nexora:nexora_ci_fixture_password@127.0.0.1:5432/nexora_fresh' > /tmp/nexora-fresh.dsn
          NEXORA_MIGRATION_DATABASE_DSN_FILE=/tmp/nexora-fresh.dsn uv run alembic upgrade head
          NEXORA_MIGRATION_DATABASE_DSN_FILE=/tmp/nexora-fresh.dsn uv run alembic check
      - name: Verify schema drift after upgrade path
        run: uv run alembic check
