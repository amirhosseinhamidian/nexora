name: Application composition

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  composition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify frozen P1-01 prerequisite
        run: python3 scripts/verify_runtime_foundation.py
      - name: Verify P1-02 application composition
        run: python3 scripts/verify_application_composition.py
      - name: Run repository contract tests
        run: python3 -m unittest discover -s tests -v

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen --python 3.13
      - name: Check backend format
        run: uv run ruff format --check apps/server
      - name: Lint backend
        run: uv run ruff check apps/server
      - name: Typecheck backend
        run: uv run mypy
      - name: Test backend and repository contracts
        run: uv run pytest -q
