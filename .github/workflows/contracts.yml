name: Contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scope-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen scope contract
        run: python3 scripts/verify_scope_contract.py
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v
