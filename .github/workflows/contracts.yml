name: Contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scope-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen scope contract
        run: python3 scripts/verify_scope_contract.py
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v

  technical-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify frozen scope prerequisite
        run: python3 scripts/verify_scope_contract.py
      - name: Verify technical baseline candidate
        run: python3 scripts/verify_technical_baseline.py
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v

  integration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify frozen scope prerequisite
        run: python3 scripts/verify_scope_contract.py
      - name: Verify frozen technical baseline prerequisite
        run: python3 scripts/verify_technical_baseline.py
      - name: Verify integration contract candidate
        run: python3 scripts/verify_integration_contracts.py
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v

  security-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify frozen scope prerequisite
        run: python3 scripts/verify_scope_contract.py
      - name: Verify frozen technical baseline prerequisite
        run: python3 scripts/verify_technical_baseline.py
      - name: Verify frozen integration contract prerequisite
        run: python3 scripts/verify_integration_contracts.py
      - name: Verify security boundary candidate
        run: python3 scripts/verify_security_boundary.py
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v

  phase-zero-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify frozen scope prerequisite
        run: python3 scripts/verify_scope_contract.py
      - name: Verify frozen technical baseline prerequisite
        run: python3 scripts/verify_technical_baseline.py
      - name: Verify frozen integration contract prerequisite
        run: python3 scripts/verify_integration_contracts.py
      - name: Verify frozen security boundary prerequisite
        run: python3 scripts/verify_security_boundary.py
      - name: Verify Phase 0 acceptance candidate
        run: python3 scripts/verify_phase_zero_acceptance.py
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v
