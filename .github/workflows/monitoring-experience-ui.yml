name: Alerts, watchlists and outcome journal

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  monitoring-experience-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify P4-07 Freeze
        run: python3 scripts/verify_decision_intelligence_ui.py
      - name: Verify P4-08 monitoring experience
        run: python3 scripts/verify_monitoring_experience_ui.py
      - name: Run repository contract regressions
        run: python3 -m unittest discover -s tests -v

  monitoring-experience-web:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.8"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Install locked Web dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Web format
        run: pnpm format:check
      - name: Lint Web
        run: pnpm lint
      - name: Typecheck Web
        run: pnpm typecheck
      - name: Test Web
        run: pnpm test
      - name: Install Chromium
        run: pnpm --filter @nexora/web exec playwright install --with-deps chromium
      - name: Build and test monitoring paths in Chromium
        run: pnpm test:e2e
