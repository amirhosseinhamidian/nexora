name: Runtime API authentication and contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen --python 3.13
      - name: Verify frozen Phase 1 readiness prerequisite
        run: uv run python scripts/verify_phase_one_readiness.py
      - name: Reject generated contract drift
        run: uv run python scripts/generate_runtime_contracts.py --check
      - name: Verify P1-07 runtime API contract
        run: uv run python scripts/verify_runtime_api_auth.py
      - name: Run repository contract tests
        run: uv run python -m unittest discover -s tests -v

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen --python 3.13
      - name: Check backend and contract format
        run: >-
          uv run ruff format --check apps/server alembic
          scripts/generate_runtime_contracts.py scripts/verify_runtime_api_auth.py
          tests/test_runtime_api_auth.py
      - name: Lint backend and contracts
        run: >-
          uv run ruff check apps/server alembic
          scripts/generate_runtime_contracts.py scripts/verify_runtime_api_auth.py
          tests/test_runtime_api_auth.py
      - name: Typecheck backend
        run: uv run mypy
      - name: Test backend and repository contracts
        run: uv run pytest -m "not integration" -q

  postgresql-17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: nexora_test
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_ci_fixture_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NEXORA_MIGRATION_DATABASE_DSN_FILE: /tmp/nexora-database.dsn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen --python 3.13
      - name: Create private CI fixture DSN file
        run: |
          umask 077
          printf '%s\n' 'postgresql+psycopg://nexora:nexora_ci_fixture_password@127.0.0.1:5432/nexora_test' > "$NEXORA_MIGRATION_DATABASE_DSN_FILE"
      - name: Upgrade to repository head
        run: uv run alembic upgrade head
      - name: Run PostgreSQL runtime integration tests
        run: uv run pytest apps/server/tests/test_postgresql_integration.py apps/server/tests/test_identity_integration.py -m integration -q
      - name: Downgrade to base
        run: uv run alembic downgrade base
      - name: Rebuild repository head
        run: uv run alembic upgrade head
      - name: Check migration drift
        run: uv run alembic check

  cross-language-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck generated TypeScript contract
        run: pnpm --filter @nexora/contracts typecheck
