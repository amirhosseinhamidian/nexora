name: nexora-private

x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-private-runtime-environment: &private-runtime-environment
  NEXORA_ENVIRONMENT: production
  NEXORA_DEPLOYMENT_PROFILE: private_single_host
  NEXORA_LOG_LEVEL: INFO
  NEXORA_DATABASE_DSN_FILE: /run/secrets/database.dsn
  NEXORA_CANONICAL_ORIGIN_FILE: /run/secrets/canonical-origin
  NEXORA_AUTH_PEPPER_FILE: /run/secrets/auth-pepper
  NEXORA_TRD_BOT_BASE_URL_FILE: /run/secrets/trd-bot-base-url
  NEXORA_TRD_BOT_TOKEN_FILE: /run/secrets/trd-bot-token
  NEXORA_ARTIFACT_ROOT: /var/lib/nexora/artifacts
  SOURCE_COMMIT_SHA: ${SOURCE_COMMIT_SHA:?deployed commit SHA required}

x-private-runtime-volumes: &private-runtime-volumes
  - ${NEXORA_DATABASE_DSN_FILE:?database DSN required}:/run/secrets/database.dsn:ro
  - ${NEXORA_CANONICAL_ORIGIN_FILE:?canonical origin required}:/run/secrets/canonical-origin:ro
  - ${NEXORA_AUTH_PEPPER_FILE:?authentication pepper required}:/run/secrets/auth-pepper:ro
  - ${NEXORA_TRD_BOT_BASE_URL_FILE:?TRD Bot base URL required}:/run/secrets/trd-bot-base-url:ro
  - ${NEXORA_TRD_BOT_TOKEN_FILE:?TRD Bot token required}:/run/secrets/trd-bot-token:ro
  - nexora-logs:/var/log/nexora
  - nexora-artifacts:/var/lib/nexora/artifacts

services:
  ingress:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "${NEXORA_PRIVATE_BIND_ADDRESS:?private overlay address required}:443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${NEXORA_TLS_CERT_FILE:?TLS certificate required}:/run/secrets/tls.crt:ro
      - ${NEXORA_TLS_KEY_FILE:?TLS private key required}:/run/secrets/tls.key:ro
    networks: [ingress]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    stop_grace_period: 20s
    logging: *bounded-logging

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks: [ingress]
    expose: ["3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/fa').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    stop_grace_period: 20s
    logging: *bounded-logging

  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      <<: *private-runtime-environment
      NEXORA_LOG_FILE: /var/log/nexora/api.jsonl
      NEXORA_API_HOST: 0.0.0.0
      NEXORA_API_PORT: "8000"
    volumes: *private-runtime-volumes
    networks: [ingress, data]
    expose: ["8000"]
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s
    logging: *bounded-logging

  worker:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    command:
      [
        "uv",
        "run",
        "--frozen",
        "nexora-worker",
        "--run",
        "--worker-id",
        "nexora-worker-1",
        "--poll-seconds",
        "2",
      ]
    environment:
      <<: *private-runtime-environment
      NEXORA_LOG_FILE: /var/log/nexora/worker.jsonl
    volumes: *private-runtime-volumes
    networks: [data]
    depends_on:
      postgresql:
        condition: service_healthy
    stop_grace_period: 45s
    logging: *bounded-logging

  postgresql:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD_FILE: /run/secrets/postgresql-password
    volumes:
      - ${NEXORA_POSTGRES_PASSWORD_FILE:?PostgreSQL password required}:/run/secrets/postgresql-password:ro
      - postgresql-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 60s
    logging: *bounded-logging

  operations:
    profiles: ["operations"]
    build:
      context: ../..
      dockerfile: infra/operations/Dockerfile
    restart: "no"
    environment:
      SOURCE_COMMIT_SHA: ${SOURCE_COMMIT_SHA:?deployed commit SHA required}
      NEXORA_POSTGRES_PASSWORD_FILE: /run/secrets/postgresql-password
      NEXORA_AGE_RECIPIENT_FILE: /run/secrets/age-recipient
      NEXORA_ARTIFACT_ROOT: /var/lib/nexora/artifacts
      NEXORA_BACKUP_ROOT: /var/lib/nexora/backups
      NEXORA_BACKUP_OFFSITE_ROOT: /var/lib/nexora/offsite-backups
      NEXORA_RETENTION_EVIDENCE_ROOT: /var/lib/nexora/retention-evidence
      NEXORA_OPERATIONS_AUDIT_FILE: /var/log/nexora/operations-audit.jsonl
    volumes:
      - ${NEXORA_POSTGRES_PASSWORD_FILE:?PostgreSQL password required}:/run/secrets/postgresql-password:ro
      - ${NEXORA_AGE_RECIPIENT_FILE:?age public recipient required}:/run/secrets/age-recipient:ro
      - nexora-artifacts:/var/lib/nexora/artifacts
      - ${NEXORA_BACKUP_ROOT:?runtime backup directory required}:/var/lib/nexora/backups
      - ${NEXORA_BACKUP_OFFSITE_ROOT:?offsite backup directory required}:/var/lib/nexora/offsite-backups
      - ${NEXORA_RETENTION_EVIDENCE_ROOT:?retention evidence directory required}:/var/lib/nexora/retention-evidence
      - nexora-logs:/var/log/nexora
    networks: [data]
    depends_on:
      postgresql:
        condition: service_healthy
    logging: *bounded-logging

networks:
  ingress:
    internal: true
  data:
    internal: true

volumes:
  postgresql-data:
  nexora-logs:
  nexora-artifacts:
