[project]
name = "nexora-server"
version = "0.1.0"
description = "Private single-owner portfolio intelligence runtime"
readme = "apps/server/README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.1",
    "cbor2==5.7.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
    "webauthn==2.7.0",
]

[project.scripts]
nexora-api = "nexora.api:run"
nexora-identity = "nexora.identity_cli:main"
nexora-worker = "nexora.worker:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/server/src/nexora"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["apps/server/tests", "tests"]
markers = [
    "integration: requires a disposable PostgreSQL 17 database at the migrated repository head",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["apps/server/src", "apps/server/tests"]

[tool.coverage.run]
branch = true
source = ["nexora"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]
